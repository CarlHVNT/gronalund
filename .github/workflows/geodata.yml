# Pulls Gröna Lund's real layout from OpenStreetMap on a GitHub runner (which
# has internet access), converts it for both maps, and commits the result to
# main. Netlify then redeploys with the real park. Start it from the Actions
# tab ("Run workflow") or through the GitHub API.
name: Update park geodata

on:
  workflow_dispatch:
    inputs:
      bbox:
        description: 'Override bounding box as south,west,north,east (optional)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: geodata
  cancel-in-progress: false

jobs:
  geodata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull OpenStreetMap data and convert
        run: |
          if [ -n "${{ inputs.bbox }}" ]; then
            node tools/park-geodata.mjs fetch --bbox "${{ inputs.bbox }}"
          else
            node tools/park-geodata.mjs fetch
          fi

      - name: Report what was found
        run: node tools/park-report.mjs

      - name: Keep the raw download as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: park-osm-raw
          path: tools/park-osm.raw.json
          retention-days: 30

      - name: Commit and push the converted data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/data/park-geo.json client/src/data/park.geojson.json
          if git diff --cached --quiet; then
            echo "Park data unchanged."
          else
            git commit -m "Update park geodata from OpenStreetMap" -m "Generated by the geodata workflow (tools/park-geodata.mjs)."
            git push
          fi
